name: fluid-music
version: 0.4.1
description: "Unified Spotify Connect, internet radio, and persistent local music player."
author: "FluidMusic contributors"
kind: backend

config_schema:
  poll_interval_open:
    type: number
    default: 8
    description: "Seconds between authoritative Spotify snapshots while the player is open. Progress is interpolated locally."
  poll_interval_closed:
    type: number
    default: 20
    description: "Seconds between authoritative Spotify snapshots while the player is closed. Progress is interpolated locally."
  radio_search_limit:
    type: number
    default: 20
    description: "Maximum HTTPS, non-HLS Radio Browser stations returned per search."
