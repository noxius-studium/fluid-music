[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "fluid-music"
version = "0.4.1"
description = "Hermes media plugin backend"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4,<5",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.urls]
Repository = "https://github.com/noxius-studium/fluid-music"
Issues = "https://github.com/noxius-studium/fluid-music/issues"

[tool.hatch.build.targets.wheel]
packages = ["dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["N999"]
"dashboard/__init__.py" = ["N999"]
