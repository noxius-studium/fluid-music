name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Install locked browser tooling
        run: npm ci
      - name: Install Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Check generated desktop runtime
        run: python scripts/build_desktop.py --check
      - name: Check JavaScript syntax
        run: node --check desktop/plugin.js
      - name: JavaScript regression tests
        run: npm test
      - name: Python tests
        run: python -m pytest -q
      - name: Python lint
        run: python -m ruff check dashboard tests scripts
      - name: Python compilation
        run: python -m compileall -q dashboard scripts
      - name: Browser, accessibility and real-audio tests
        run: npm run test:ui
      - name: Build unified plugin archive
        run: python scripts/package.py
      - name: Upload verified plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fluid-music-${{ runner.os }}-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ runner.os }}-${{ github.sha }}
          path: .hermes-tests/ui/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
